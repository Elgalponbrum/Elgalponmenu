<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El Galpón | Menú digital</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at top,#4b0900,#100807 45%,#050505);color:#fff;font-family:system-ui,Arial,sans-serif}header{text-align:center;padding:35px 15px 20px;border-bottom:3px solid #f33}header .emoji{font-size:58px}h1{font-size:clamp(38px,9vw,65px);margin:0;color:white;text-shadow:0 0 10px #f30,0 0 22px red}header p{color:#ffd65c;font-weight:700}nav{position:sticky;top:0;background:#150a08ed;display:flex;gap:8px;overflow-x:auto;padding:12px;z-index:2;border-bottom:1px solid #e43}nav a{white-space:nowrap;color:white;text-decoration:none;background:linear-gradient(#9e1a09,#3a0906);border:1px solid #ffb800;border-radius:22px;padding:10px 14px;font-size:14px;font-weight:700}main{max-width:950px;margin:auto;padding:15px}section{scroll-margin-top:85px;margin:18px 0 26px;border:2px solid #f64b1c;border-radius:19px;overflow:hidden;background:#100e0ce8;box-shadow:0 0 13px #c20b00}h2{margin:0;padding:16px;background:linear-gradient(90deg,#a40000,#f12d00,#5c0000);font-size:23px;text-shadow:1px 2px #500}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px dotted #54362b;font-size:16px}.item:last-child{border:0}.price{background:#ffd522;color:#171000;padding:5px 12px;border-radius:25px;font-weight:900;white-space:nowrap}footer{text-align:center;padding:30px 15px 50px;color:#ffe3a1;font-size:20px;font-style:italic}small{display:block;font-size:12px;color:#e6b4a3;margin-top:10px}</style></head><body><header><div class="emoji">🍔🔥🍦</div><h1>El Galpón</h1><p>HAMBURGUESERÍA · HELADERÍA<br>POOL · FUTBOLITO · TRAGOS</p><h2>MENÚ DIGITAL</h2></header><nav id="nav"></nav><main id="menu"></main><footer>¡Vos elegís el sabor,<br>nosotros hacemos tus gustos realidad!<small>Precios en pesos ection.append(item)});menu.append(section)});</script></body></htm
